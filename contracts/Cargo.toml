[workspace]
resolver = "3"
members = ["strip-vault", "mock-stnear", "pt-token", "tests"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.9.5", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
